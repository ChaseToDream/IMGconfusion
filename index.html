<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="纯客户端图片混淆与还原工具，保护您的隐私图片" />
    <title>IMG Confusion - 图片混淆与还原</title>
    <script>
      ;(function() {
        var t = localStorage.getItem('theme')
        if (t === 'light') document.documentElement.classList.remove('dark')
        else document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="min-h-screen font-body antialiased transition-colors duration-300
               bg-surface-50 text-surface-900 dark:bg-surface-950 dark:text-surface-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
